              <div class="campo"><label for="aApellido">${t("apellido")}</label><input id="aApellido" type="text" autocomplete="family-name" maxlength="60"></div></div>` : ""}
            <div class="campo"><label for="aCorreo">${t("correo")}</label><input id="aCorreo" type="email" autocomplete="email" maxlength="254"></div>
            ${reg ? `<div class="campo"><label for="aTel">${t("telefono")}</label><input id="aTel" type="tel" autocomplete="tel" maxlength="25" placeholder="+57 300 123 4567"></div>` : ""}
            <div class="campo"><label for="aClave">${t("clave")}</label><input id="aClave" type="password" autocomplete="${reg ? "new-password" : "current-password"}" maxlength="128">${reg ? `<small>${t("claveAyuda")}</small>` : ""}</div>
            ${reg ? `<p class="sec-tit">${t("seccionDir")}</p>${formDireccion("r")}` : ""}
            ${reg ? `<label class="chk-fila"><input id="aAutoriza" type="checkbox"><span>${t("autoriza")}</span></label>` : ""}
            <div class="err" id="aErr" role="alert" hidden></div>
            <button class="btn-naranja" type="submit" style="width:100%">${t(reg ? "crearCuenta" : "entrar")}</button>
            <p class="muted" style="margin-top:14px">${t("soloClientes")}</p>
          </form>`;
      }
      if (!$("#auth").open) $("#auth").showModal();
    }

    document.addEventListener("change", e => {
      const el = e.target.closest("[data-ubic]"); if (!el) return;
      const p = el.dataset.p, tipo = el.dataset.ubic;
      if (tipo === "pais") { $(`#${p}RegionBox`).innerHTML = regionHTML(p, el.value, ""); $(`#${p}CiudadBox`).innerHTML = ciudadHTML(p, el.value, "", ""); }
      else if (tipo === "region") $(`#${p}CiudadBox`).innerHTML = ciudadHTML(p, $(`#${p}Pais`).value, el.value, "");
      else { const tx = $(`#${p}CiudadTxt`); tx.hidden = el.value !== "__otra"; if (!tx.hidden) tx.focus(); }
    });

    document.addEventListener("submit", async e => {
      if (e.target.id === "formAuth") {
        e.preventDefault();
        const reg = e.target.dataset.form === "crear", err = $("#aErr"), g = id => ($("#" + id)?.value || "").trim();
        const email = g("aCorreo"), clave = $("#aClave").value;
        const fallo = txt => { err.hidden = false; err.textContent = txt; };
        const correoOk = /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email);
        let cuerpo;
        if (reg) {
          const nombre = g("aNombre"), apellido = g("aApellido"), telefono = g("aTel"), dir = leerDireccion("r");
          if (nombre.length < 2) return fallo(t("errNombre"));
          if (apellido.length < 2) return fallo(t("errApellido"));
          if (!correoOk) return fallo(t("errCorreo"));
          if (!telValido(telefono)) return fallo(t("errTel"));
          if (clave.length < 8) return fallo(t("errClave"));
          const problema = validarDireccion(dir); if (problema) return fallo(problema);
          if (!$("#aAutoriza").checked) return fallo(t("errAutoriza"));
          cuerpo = {nombre, apellido, email, password: clave, telefono, ...dir, autorizacion_datos: true};
        } else {
          if (!correoOk) return fallo(t("errCorreo"));
          if (!clave) return fallo(t("errLogin"));
          cuerpo = {email, password: clave};
        }
        const r = await pedir(reg ? "/cuenta/registro" : "/cuenta/entrar", "POST", cuerpo);
        if (r.ok) {
          CUENTA = r.datos;
          pintarCuentaBtn();
          $("#auth").close();
          aviso(t("bienvenido", CUENTA.nombre.split(" ")[0]));
          cargarPedidos();
          return;
        }
        fallo(r.status === 422 && r.datos?.detalles ? t("errDatos") + " " + r.datos.detalles.join(" · ")
          : ({401: t("errLogin"), 409: t("errDup"), 429: t("errMuchos"), 0: t("errRed")})[r.status] || t("errDatos"));
        return;
      }
      if (e.target.id === "formPerfil") {
        e.preventDefault();
        const err = $("#uErr"), g = id => ($("#" + id)?.value || "").trim();
        const fallo = txt => { err.hidden = false; err.textContent = txt; };
        const nombre = g("uNombre"), apellido = g("uApellido"), email = g("uCorreo"), telefono = g("uTel");
        const claveActual = $("#uClaveActual").value, claveNueva = $("#uClaveNueva").value;
        const correoOk = /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email);

        if (nombre.length < 2) return fallo(t("errNombre"));
        if (apellido.length < 2) return fallo(t("errApellido"));
        if (!correoOk) return fallo(t("errCorreo"));
        if (!telValido(telefono)) return fallo(t("errTel"));
        const dir = leerDireccion("u");
        const problema = validarDireccion(dir);
        if (problema) return fallo(problema);

        const emailCambio = email.toLowerCase() !== (CUENTA?.email || "").toLowerCase();
        const cambiaClave = claveNueva.length > 0;

        if ((emailCambio || cambiaClave) && !claveActual) {
          return fallo(t("errClaveActual"));
        }
        if (cambiaClave && claveNueva.length < 8) {
          return fallo(t("errClave"));
        }

        const cuerpo = {
          nombre,
          apellido,
          email,
          telefono,
          ...dir
        };
        if (claveActual) cuerpo.password_actual = claveActual;
        if (claveNueva) cuerpo.password_nueva = claveNueva;

        const r = await pedir("/cuenta/perfil", "PUT", cuerpo);
        if (r.ok) {
          CUENTA = r.datos;
          pintarCuentaBtn();
          $("#auth").close();
          aviso(t("perfilActualizado"));
          cargarPedidos(true);
          return;
        }
        const txtError = r.status === 422 && r.datos?.detalles ? t("errDatos") + " " + r.datos.detalles.join(" · ")
          : ({401: r.datos?.error || t("errLogin"), 409: t("errDup"), 429: t("errMuchos"), 0: t("errRed")})[r.status] || (r.datos?.error || t("errDatos"));
        fallo(txtError);
      }
    });

    aplicarIdioma();
    $("#notaVentana").textContent = t("ventana", VENTANA);
    cargarUbic();
    cargarCuenta();
    cargarPedidos();
    if (location.hash === "#turnos") pestana("turnos");
    setInterval(() => { if (!$("#panelTurnos").hidden) cargarTurnos(); }, 4000);
    setInterval(() => { if (!document.hidden && !$("#det").open) cargarPedidos(true); }, 30000);

    /* =================== configuración =================== */
    function abrirConfig() {
      const grupo = (id, opciones, actual) => `<div class="cfg-grupo"><p class="cfg-tit" id="cfg-${id}">${t("cfg_" + id)}</p>
        <div class="chips" role="group" aria-labelledby="cfg-${id}">${opciones.map(([v, txt]) =>
          `<button class="chip" data-cfg="${id}" data-v="${v}" aria-pressed="${actual === v}">${esc(txt)}</button>`).join("")}</div></div>`;
      $("#configCuerpo").innerHTML = `<button class="cerrar" data-accion="cerrar-dialogo" aria-label="${t("cerrar")}">&times;</button><h2>${t("config")}</h2>
        ${grupo("tema", [["oscuro", t("oscuro")], ["claro", t("claro")]], CFG.tema)}
        ${grupo("lang", [["es", "Español"], ["en", "English"]], CFG.lang)}
        ${grupo("moneda", [["USD", "USD · US$"], ["COP", "COP · $"]], CFG.moneda)}
        <p class="muted">${esc(t("notaTasa", num(TASA, 0)))}</p>`;
      if (!$("#config").open) $("#config").showModal();
    }

    function refrescarTodo() {
      aplicarIdioma();
      pintarCuentaBtn();
      $("#notaVentana").textContent = t("ventana", VENTANA);
      pintarPedidos();
      if (ABIERTO && $("#det").open) {
        const p = PEDIDOS.find(x => x.order_id === ABIERTO);
        if (p) pintarDetalle(p);
      }
      if (!$("#panelTurnos").hidden) cargarTurnos();
    }

    document.addEventListener("click", e => {
      const cfg = e.target.closest("[data-cfg]");
      if (cfg) {
        CFG[cfg.dataset.cfg] = cfg.dataset.v;
        guardarCfg();
        const aplicar = () => { refrescarTodo(); abrirConfig(); };
        if (cfg.dataset.cfg === "tema" && document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.startViewTransition(aplicar);
        } else {
          aplicar();
        }
        return;
      }
      const modo = e.target.closest("[data-modo]");
      if (modo) { abrirAuth(modo.dataset.modo); return; }
      const b = e.target.closest("[data-accion]");
      if (b) {
        switch (b.dataset.accion) {
          case "cerrar-dialogo": e.target.closest("dialog")?.close(); break;
          case "config": abrirConfig(); break;
          case "cuenta": abrirAuth("entrar"); break;
          case "editar-perfil": abrirAuth("editar"); break;
          case "ver-perfil": abrirAuth("perfil"); break;
          case "salir-cuenta": pedir("/cuenta/salir", "POST").then(() => { CUENTA = null; pintarCuentaBtn(); $("#auth").close(); aviso(t("sesionCerrada")); cargarPedidos(); }); break;
        }
      }
    });

    $$("dialog").forEach(d => d.addEventListener("click", e => { if (e.target === d) d.close(); }));
  </script>
</body>

</html>
